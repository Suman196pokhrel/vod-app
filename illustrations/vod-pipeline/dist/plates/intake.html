// Shared page runtime: theme, tabs (hash routed), mounting one plate at a time, and a
// visibility-aware frame loop. Plates register themselves in PLATES[id] = { mount }.
const PLATES = {};
const stillQuery = matchMedia("(prefers-reduced-motion: reduce)");

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("vod-anatomy-theme"); } catch {}
  const prefers = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.body.dataset.theme = saved || prefers;
  document.querySelector("[data-theme-toggle]").addEventListener("click", () => {
    const next = document.body.dataset.theme === "light" ? "dark" : "light";
    document.body.dataset.theme = next;
    try { localStorage.setItem("vod-anatomy-theme", next); } catch {}
  });
}

let current = null;
function openTab(id) {
  const tpl = document.getElementById(`tpl-${id}`);
  if (!tpl) return;
  if (current?.id === id) return;
  current?.instance?.unmount?.();
  const mount = document.querySelector("[data-mount]");
  mount.replaceChildren(tpl.content.cloneNode(true));
  for (const tab of document.querySelectorAll(".tab")) tab.setAttribute("aria-selected", String(tab.dataset.tab === id));
  const root = mount.querySelector(".plate");
  current = { id, instance: PLATES[id]?.mount(root) };
}

function initTabs() {
  for (const tab of document.querySelectorAll(".tab:not(:disabled)")) {
    tab.addEventListener("click", () => { location.hash = tab.dataset.tab; });
  }
  const route = () => openTab(location.hash.slice(1) || document.querySelector(".tab:not(:disabled)").dataset.tab);
  addEventListener("hashchange", route);
  route();
}

// A frame loop that pauses offscreen and clamps dt so a background tab never jumps.
function frameLoop(stage, tick) {
  let frame = 0, last = 0, visible = true, alive = true;
  const run = (now) => {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    tick(dt, stillQuery.matches);
    frame = alive && visible ? requestAnimationFrame(run) : 0;
  };
  const io = new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible && !frame && alive) { last = 0; frame = requestAnimationFrame(run); }
  }, { rootMargin: "120px 0px" });
  io.observe(stage);
  frame = requestAnimationFrame(run);
  return () => { alive = false; cancelAnimationFrame(frame); io.disconnect(); };
}

// Hover, focus and legend keys all select one station; everything else steps down a tone.
function focusing(root, stations, onFocus) {
  const stage = root.querySelector(".stage");
  const items = [...stage.querySelectorAll(".it")];
  const text = root.querySelector("[data-focus-text]");
  const keys = [...root.querySelectorAll("[data-key]")];
  let on = null;
  const set = (id) => {
    if (id === on) return;
    on = id;
    if (id) stage.dataset.focus = id; else delete stage.dataset.focus;
    for (const it of items) {
      const mine = it.dataset.st === id;
      it.classList.toggle("on", !!id && mine);
      it.classList.toggle("dim", !!id && !mine);
    }
    for (const key of keys) key.toggleAttribute("data-on", key.dataset.key === id);
    const s = stations.find((x) => x.id === id);
    text.innerHTML = s ? `<b>${String(s.n).padStart(2, "0")} · ${s.name}</b><br>${s.role}` : "Hover any machine, or a number below, to see what it is.";
    onFocus?.(id);
  };
  stage.addEventListener("pointermove", (e) => {
    const st = e.target.closest?.(".it")?.dataset.st;
    set(stations.some((x) => x.id === st) ? st : null);
  });
  stage.addEventListener("pointerleave", () => set(null));
  for (const key of keys) {
    key.addEventListener("pointerenter", () => set(key.dataset.key));
    key.addEventListener("pointerleave", () => set(null));
    key.addEventListener("focus", () => set(key.dataset.key));
    key.addEventListener("blur", () => set(null));
  }
  return set;
}

const fmtT = (t) => `${t.toFixed(1)}s`;
function renderLog(list, log, max = 60) {
  const last = list.dataset.n ? Number(list.dataset.n) : -1;
  const fresh = log.filter((e) => e.n > last);
  if (!fresh.length) return;
  for (const e of fresh) {
    const li = document.createElement("li");
    if (e.tone) li.dataset.tone = e.tone;
    li.innerHTML = `<span class="t">${fmtT(e.t)}</span><span>${e.text}${e.ref ? `<span class="ref">${e.ref}</span>` : ""}</span>`;
    list.prepend(li);
  }
  while (list.children.length > max) list.lastChild.remove();
  list.dataset.n = String(log[log.length - 1].n);
}

// Click a machine (or its legend number) to glide the camera in on it; click again or Esc to return.
function zooming(root, stations, onZoom) {
  const stage = root.querySelector(".stage");
  const plate = root.querySelector(".iso-plate");
  const svg = stage.querySelector("svg");
  const home = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  let view = [...home], from = [...home], to = [...home], t = 1, raf = 0, on = null;
  const boxOf = (id) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const el of stage.querySelectorAll(`.it[data-st="${id}"]`)) {
      if (el.hasAttribute("data-hide")) continue;
      const b = el.getBBox();
      if (!b.width && !b.height) continue;
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
    }
    const pad = 0.09 * Math.max(x1 - x0, y1 - y0);
    let [x, y, w, h] = [x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad];
    const aspect = home[2] / home[3];
    if (w / h < aspect) { const nw = h * aspect; x -= (nw - w) / 2; w = nw; } else { const nh = w / aspect; y -= (nh - h) / 2; h = nh; }
    return [x, y, w, h];
  };
  const ease = (u) => 1 - Math.pow(1 - u, 3);
  const frame = () => {
    t = Math.min(1, t + 1 / 33);
    view = from.map((v, i) => v + (to[i] - v) * ease(t));
    svg.setAttribute("viewBox", view.map((v) => v.toFixed(2)).join(" "));
    raf = t < 1 ? requestAnimationFrame(frame) : 0;
  };
  const go = (id) => {
    on = id;
    from = [...view];
    to = id ? boxOf(id) : [...home];
    t = stillQuery.matches ? 0.999 : 0;
    stage.toggleAttribute("data-zoomed", !!id);
    plate.toggleAttribute("data-zoomed", !!id);
    if (!raf) raf = requestAnimationFrame(frame);
    onZoom?.(id);
  };
  stage.addEventListener("click", (e) => {
    const st = e.target.closest?.(".it")?.dataset.st;
    if (on) return go(null);
    if (stations.some((x) => x.id === st)) go(st);
  });
  for (const key of root.querySelectorAll("[data-key]")) key.addEventListener("click", () => go(on === key.dataset.key ? null : key.dataset.key));
  root.querySelector("[data-zoom-out]")?.addEventListener("click", () => go(null));
  const esc = (e) => { if (e.key === "Escape" && on) go(null); };
  addEventListener("keydown", esc);
  return { go, stop: () => { cancelAnimationFrame(raf); removeEventListener("keydown", esc); } };
}

// Pulses on single cables: each pulse is a lit dash that runs a cable's length, drawn as a
// dash pattern on the cable chunks' centrelines (in user units, so zoom keeps them aligned).
function cableIndex(stage) {
  const cables = {};
  for (const el of stage.querySelectorAll(".pulse")) {
    (cables[el.dataset.pulse] ||= []).push({ el, from: +el.dataset.from, to: +el.dataset.to, total: +el.dataset.total, len: el.getTotalLength() });
  }
  return cables;
}

function dashesFor(pc, at, half) {
  const k = pc.len / Math.max(1e-6, pc.to - pc.from);
  const spans = at.map((s) => [Math.max(pc.from, s - half), Math.min(pc.to, s + half)]).filter(([a, b]) => b > a).map(([a, b]) => [(a - pc.from) * k, (b - pc.from) * k]).sort((x, y) => x[0] - y[0]);
  if (!spans.length) return "0 100000";
  const arr = [0];
  let cursor = 0;
  for (const [a, b] of spans) { arr.push(Math.max(0, a - cursor), b - Math.max(a, cursor)); cursor = b; }
  arr.push(pc.len + 100);
  return arr.map((v) => v.toFixed(2)).join(" ");
}

function cablePulser(stage, { speed = 160, half = 6 } = {}) {
  const cables = cableIndex(stage);
  const live = [];
  return {
    send(id, dir = 1) { if (cables[id]) live.push({ id, dir, at: 0, total: cables[id][0].total }); },
    draw(dt) {
      const on = {};
      for (const p of live) { p.at += dt * speed; (on[p.id] ||= []).push(p.dir > 0 ? p.at : p.total - p.at); }
      for (let i = live.length - 1; i >= 0; i--) if (live[i].at > live[i].total + half) live.splice(i, 1);
      for (const [id, pieces] of Object.entries(cables)) for (const pc of pieces) pc.el.style.strokeDasharray = dashesFor(pc, on[id] || [], half);
    },
    clear() { live.length = 0; },
  };
}

// Plate 1 renderer: maps the model's state onto the machine (tokens, lamps, lanes,
// spindles) and turns the model's traffic into pulses that travel the real links.
function plantRenderer(stage, DATA) {
  const P = DATA.P;
  const dyn = {};
  for (const el of stage.querySelectorAll("[data-dyn]")) dyn[el.dataset.dyn] = el;
  const lamps = {};
  for (const el of stage.querySelectorAll("[data-lamp]")) lamps[el.dataset.lamp] = el;
  const cables = {};
  for (const el of stage.querySelectorAll(".pulse")) {
    const id = el.dataset.pulse;
    (cables[id] ||= []).push({ el, from: +el.dataset.from, to: +el.dataset.to, total: +el.dataset.total, len: el.getTotalLength() });
  }
  const busG = stage.querySelector("[data-bus-pulses]");
  const busPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
  busPath.setAttribute("class", "bus-pulse");
  busG.append(busPath);
  const q = (sel) => [...stage.querySelectorAll(sel)];
  const bars = q("[data-upbar]"), pips = q("[data-pip]"), tiles = q("[data-tilerow]");
  const gauges = Object.fromEntries(q("[data-bucket]").map((el) => [el.dataset.bucket, el]));
  const scrub = stage.querySelector("[data-scrub]"), paused = stage.querySelector("[data-paused]"), needle = stage.querySelector("[data-needle]");
  const dial = DATA.dial;

  const show = (name, on) => dyn[name]?.toggleAttribute("data-hide", !on);
  const flashes = {};
  const flash = (name, warn = false) => { flashes[name] = { left: 0.35, warn }; };

  // ---- traffic pulses -------------------------------------------------------------
  const SPEED = 520, HALF = 7;
  const pulses = [];
  const linkLen = (id) => cables[id]?.[0]?.total ?? 20;
  const out = (end) => (end === "admin" || end === "viewer" ? [{ c: end, dir: 1 }, { c: "caddy", dir: 1 }] : [{ c: end, dir: 1 }]);
  const tapOf = (end) => DATA.taps[end === "admin" || end === "viewer" ? "caddy" : end];
  function routeOf(from, to) {
    const legs = [...out(from), { bus: [tapOf(from), tapOf(to)] }, ...out(to).reverse().map((l) => ({ ...l, dir: -l.dir }))];
    for (const l of legs) l.len = l.bus ? Math.abs(l.bus[1] - l.bus[0]) : linkLen(l.c);
    return legs;
  }
  function traffic(ev, calm) {
    const legs = routeOf(ev.from, ev.to);
    if (!calm) pulses.push({ legs, at: 0, total: legs.reduce((a, l) => a + l.len, 0), ev });
    const via = ev.from === "admin" || ev.to === "admin" || ev.from === "viewer" || ev.to === "viewer";
    if (via) flash(`route-${ev.to === "tusd" || ev.from === "tusd" ? "files" : ev.to === "minio" || ev.from === "minio" ? "storage" : "api"}`);
    if (ev.kind.includes("pre-create")) flash("hook-pre-create");
    if (ev.kind.includes("post-finish")) flash("hook-post-finish");
    if (ev.kind.startsWith("GET status")) flash("hook-status");
    if (ev.kind.startsWith("PATCH")) kick.blade = 1;
    const bucket = /raw|UploadPart/.test(ev.kind) ? "videos" : /sprites/.test(ev.kind) ? "thumbnails" : /master|seg/.test(ev.kind) ? "processed" : null;
    if (bucket) flash(`bucket-${bucket}`);
  }
  const kick = { blade: 0 };

  function drawPulses(dt) {
    const onCable = {};
    const onBus = [];
    for (const p of pulses) {
      p.at += dt * SPEED;
      let s = p.at;
      for (const l of p.legs) {
        if (s <= l.len + HALF && s >= -HALF) {
          if (l.bus) onBus.push(l.bus[0] + Math.sign(l.bus[1] - l.bus[0] || 1) * s);
          else (onCable[l.c] ||= []).push(l.dir > 0 ? s : l.len - s);
        }
        if (s >= 0 && s <= l.len && !l.bus && l.c !== "admin" && l.c !== "viewer") flash(`tap-${l.c}`);
        s -= l.len;
      }
    }
    for (let i = pulses.length - 1; i >= 0; i--) if (pulses[i].at > pulses[i].total + HALF) pulses.splice(i, 1);
    for (const [id, pieces] of Object.entries(cables)) {
      const at = onCable[id] || [];
      for (const pc of pieces) pc.el.style.strokeDasharray = dashFor(pc, at);
    }
    busPath.setAttribute("d", onBus.map((x) => {
      const a = Math.max(DATA.bus.x0, x - HALF), b = Math.min(DATA.bus.x1, x + HALF);
      if (b <= a) return "";
      const p0 = iso([a, DATA.bus.y, DATA.bus.z], P), p1 = iso([b, DATA.bus.y, DATA.bus.z], P);
      return `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    }).join(""));
  }
  function dashFor(pc, at) {
    const k = pc.len / Math.max(1e-6, pc.to - pc.from);
    const spans = at.map((s) => [Math.max(pc.from, s - HALF), Math.min(pc.to, s + HALF)]).filter(([a, b]) => b > a).map(([a, b]) => [(a - pc.from) * k, (b - pc.from) * k]).sort((x, y) => x[0] - y[0]);
    if (!spans.length) return "0 100000";
    const arr = [0];
    let cursor = 0;
    for (const [a, b] of spans) { arr.push(Math.max(0, a - cursor), b - Math.max(a, cursor)); cursor = b; }
    arr.push(pc.len + 100);
    return arr.map((v) => v.toFixed(2)).join(" ");
  }

  // ---- machine state ----------------------------------------------------------------
  const lanes = new Array(8).fill(null);
  const slots = [];
  const heads = [0, 0, 0];
  let blade = 0;
  let playClock = 0, nextSeg = 0, playing = null;

  function render(s, dt, calm) {
    for (const up of s.uploads) {
      if (up.state === "uploading" && !lanes.includes(up.id)) lanes[lanes.indexOf(null)] = up.id;
    }
    lanes.forEach((id, i) => {
      const up = id && s.uploads.find((u) => u.id === id);
      if (up && up.state !== "uploading") lanes[i] = null;
      const n = up && up.state === "uploading" ? Math.ceil((8 * up.sent) / up.sizeMB) : 0;
      for (let j = 0; j < 8; j++) show(`wafer-${i}-${j}`, j < n);
      lamps[`lane-${i}`]?.toggleAttribute("data-on", !!lanes[i]);
      const bar = bars[i];
      bar.querySelector(".bar-fill").setAttribute("width", up ? ((DATA.barW * up.sent) / up.sizeMB).toFixed(2) : 0);
    });
    const waiting = s.uploads.filter((u) => u.state !== "done" && u.state !== "error");
    for (let i = 0; i < 12; i++) {
      const up = waiting[i];
      show(`can-${i}`, !!up);
      if (up) dyn[`can-${i}`].dataset.state = up.state === "uploading" ? "up" : up.state === "retrying" ? "wait" : "new";
    }
    const errs = s.uploads.filter((u) => u.state === "error" || u.state === "retrying").length;
    lamps["admin-power"]?.toggleAttribute("data-warn", errs > 0);
    lamps["admin-power"]?.toggleAttribute("data-on", errs === 0);
    blade = Math.max(kick.blade, blade - dt * 4);
    kick.blade = 0;
    dyn.blade?.setAttribute("transform", translateAlong(P, [0, 0, -4 * Math.sin(Math.PI * blade)]));

    const vids = [...s.videos].sort((a, b) => a.created - b.created).slice(-12);
    for (let i = 0; i < 12; i++) {
      const card = stage.querySelector(`[data-card="${i}"]`);
      const v = vids[i];
      card.parentElement.toggleAttribute("data-hide", !v);
      if (v) card.dataset.state = v.status === "queued" ? "queued" : v.status === "completed" ? "done" : v.status === "failed" ? "failed" : "active";
    }
    for (let i = 0; i < 8; i++) show(`token-${i}`, i < s.admission.length);
    show("lock-tag", !!s.lock);
    for (let i = 0; i < 12; i++) show(`chit-${i}`, i < s.broker.length);

    for (const m of s.running) if (m.slot === undefined) { const used = s.running.map((x) => x.slot); m.slot = [0, 1, 2].find((i) => !used.includes(i)); }
    for (let i = 0; i < 3; i++) {
      const busy = s.running.find((m) => m.slot === i);
      show(`work-${i}`, !!busy);
      show(`lockout-${i}`, i >= s.cfg.concurrency);
      heads[i] = calm ? (busy ? 1 : 0) : heads[i] + ((busy ? 1 : 0) - heads[i]) * (1 - Math.exp(-dt / 0.18));
      dyn[`head-${i}`]?.setAttribute("transform", translateAlong(P, [0, 0, -9 * heads[i]]));
      lamps[`spindle-${i}`]?.toggleAttribute("data-on", !!busy);
    }
    const active = s.videos.find((v) => v.id === s.lock) || s.videos.find((v) => v.id === s.running[0]?.vid) || null;
    const shown = active || [...s.videos].reverse().find((v) => v.status === "completed" && !v.seed) || null;
    for (const st of DATA.stages) lamps[`stage-${st}`]?.toggleAttribute("data-on", active?.status === st);
    for (let i = 0; i < 7; i++) {
      const r = shown?.rungs[i];
      show(`rung-${i}`, !!r && (r.state === "done" || r.state === "encoding"));
      if (r) dyn[`rung-${i}`].dataset.state = r.state;
      show(`skip-${i}`, !!r && (r.state === "skipped" || r.state === "skipping"));
    }
    const sb = s.running.find((m) => m.task === "generate_storyboard");
    const after = shown && !["queued", "dispatched", "preparing", "generating_storyboard", "failed"].includes(shown.status);
    const rows = sb ? Math.floor((10 * (s.t - sb.start)) / sb.dur) : after ? 10 : 0;
    tiles.forEach((el, i) => el.toggleAttribute("data-on", i < rows));
    const fill = (b, n) => gauges[b]?.setAttribute("width", ((DATA.gaugeW * Math.min(n, 12)) / 12).toFixed(2));
    fill("videos", s.videos.length);
    fill("thumbnails", s.videos.filter((v) => !["queued", "dispatched", "preparing", "generating_storyboard"].includes(v.status) && v.status !== "failed").length);
    fill("processed", s.videos.filter((v) => v.status === "completed").length);

    railRender(s, dt, calm);
    viewerPlay(s, dt);
    for (const [name, f] of Object.entries(flashes)) {
      f.left -= dt;
      const el = lamps[name];
      if (el && !name.startsWith("lane") && !name.startsWith("spindle") && !name.startsWith("stage")) el.toggleAttribute(f.warn ? "data-warn" : "data-on", f.left > 0);
      if (f.left <= 0) delete flashes[name];
    }
    drawPulses(calm ? 0 : dt);
  }

  // Status rail: a carriage per unfinished video (oldest three), parked at its status's real progress value.
  const carLane = new Map(), carX = [0, 0, 0];
  const pct = (v) => (v.status === "failed" ? 0 : PROGRESS[v.status] ?? 15);
  function railRender(s, dt, calm) {
    for (const v of s.videos) if ((v.status === "completed" || v.status === "failed") && v.leftAt === undefined) v.leftAt = s.t;
    for (const [id, lane] of carLane) { const v = s.videos.find((x) => x.id === id); if (!v || (v.leftAt !== undefined && s.t - v.leftAt > 2.5)) carLane.delete(id); }
    for (const v of [...s.videos].sort((a, b) => a.created - b.created)) {
      if (carLane.has(v.id) || v.leftAt !== undefined || v.seed) continue;
      const used = [...carLane.values()];
      const free = [0, 1, 2].find((i) => !used.includes(i));
      if (free === undefined) break;
      carLane.set(v.id, free);
      carX[free] = 0;
    }
    const lit = new Set();
    for (let i = 0; i < 3; i++) {
      const id = [...carLane.entries()].find(([, l]) => l === i)?.[0];
      const v = id && s.videos.find((x) => x.id === id);
      show(`car-${i}`, !!v);
      if (!v) continue;
      const target = ((DATA.rail.x1 - DATA.rail.x0) * pct(v)) / 100;
      carX[i] = calm ? target : carX[i] + (target - carX[i]) * (1 - Math.exp(-dt / 0.35));
      dyn[`car-${i}`].setAttribute("transform", translateAlong(P, [carX[i], 0, 0]));
      dyn[`car-${i}`].dataset.state = v.status === "queued" ? "queued" : v.status;
      lit.add(v.status);
    }
    for (const st of DATA.rail.stops) {
      lamps[`stop-${st}`]?.toggleAttribute(st === "failed" ? "data-warn" : "data-on", lit.has(st));
    }
  }

  // The viewer plays the newest finished video, switching rendition as bandwidth moves.
  function viewerPlay(s, dt) {
    const v = s.videos.filter((x) => x.status === "completed" && x.public).sort((a, b) => a.done - b.done).pop();
    paused.style.display = v ? "none" : "";
    if (!v) { pips.forEach((p) => p.removeAttribute("data-on")); return; }
    if (playing !== v.id) { playing = v.id; playClock = 0; nextSeg = 0; s.traffic.push({ t: s.t, from: "viewer", to: "minio", kind: "GET master.m3u8" }); }
    playClock += dt;
    const mbps = 4.5 + 4 * Math.sin(playClock * 0.55) + 2.2 * Math.sin(playClock * 1.7);
    const avail = v.rungs.map((r, i) => ({ ...r, i })).filter((r) => r.state === "done");
    const pick = avail.find((r) => (r.kbps + 128) * 1.25 <= mbps * 1000) || avail[avail.length - 1];
    pips.forEach((p) => p.toggleAttribute("data-on", +p.dataset.pip === pick.i));
    const a = dial.a0 + (dial.a1 - dial.a0) * Math.min(1, Math.max(0, mbps / 12));
    needle.setAttribute("d", lineOnTop([dial.x, dial.y], [dial.x + Math.sin(a) * dial.r, dial.y - Math.cos(a) * dial.r], dial.z, P));
    scrub.setAttribute("width", ((DATA.scrubW * ((playClock * 10) % v.duration)) / v.duration).toFixed(2));
    if (playClock >= nextSeg) { nextSeg = playClock + 0.6; s.traffic.push({ t: s.t, from: "viewer", to: "minio", kind: `GET ${pick.q}/segment.ts` }); }
  }

  return { render, traffic, reset() { lanes.fill(null); pulses.length = 0; playing = null; carLane.clear(); } };
}

// Plate 1 controller: scenarios, switches, the idle tour, narration, stats and the loop.
const SCENARIOS = {
  one: { label: "One upload", uploads: [{ sizeMB: 900, height: 1080, duration: 420 }], why: "Low load: the upload streams in, the lock is free, so processing starts the moment post-finish fires. Every stage runs back to back on one worker." },
  burst: { label: "5 uploads at once", uploads: [{ sizeMB: 1300, height: 1080, duration: 600 }, { sizeMB: 600, height: 720, duration: 300 }, { sizeMB: 1800, height: 1440, duration: 840 }, { sizeMB: 450, height: 1080, duration: 240 }, { sizeMB: 900, height: 480, duration: 420 }], why: "High load: uploads run concurrently (they only share bandwidth), but processing is one video at a time. Whoever finishes uploading first is queued first; the Redis lock lets exactly one chain run and the rest wait as 'queued' rows in PostgreSQL." },
  cap: { label: "9 at once (hit the cap)", uploads: Array.from({ length: 9 }, (_, i) => ({ sizeMB: 700 + i * 30, height: 1080, duration: 300 })), why: "Admission control: pre-create counts tus:active:* keys in Redis and refuses a 9th concurrent upload with 503 + Retry-After: 30. Uppy retries after 0.1, 1, 3 and 5 s (its default retryDelays); if all 8 slots are still busy, the admin sees the error and tries later." },
  lowres: { label: "480p source", uploads: [{ sizeMB: 500, height: 480, duration: 360 }], why: "No upscaling: the chord still queues all 7 transcodes, but 1440p, 1080p and 720p return 'skipped' at once, so master.m3u8 lists only 4 variants." },
  corrupt: { label: "Corrupt file, then a good one", uploads: [{ sizeMB: 400, height: 1080, duration: 300, fault: "corrupt" }, { sizeMB: 800, height: 1080, duration: 360 }], why: "Failure isolation: ffprobe can't read the first file, prepare_video marks it failed and raises, the chain's link_error (on_pipeline_failed) releases the lock, and the next queued video starts. One bad upload never jams the queue." },
};
const TOUR = ["burst", "cap", "one", "lowres", "corrupt"];

function plantStory(s) {
  const up = s.uploads.filter((u) => u.state === "uploading");
  const retry = s.uploads.filter((u) => u.state === "retrying");
  const q = s.videos.filter((v) => v.status === "queued");
  const lockV = s.videos.find((v) => v.id === s.lock);
  const parts = [];
  if (s.worker === "down") return "The worker container is restarting. On boot, worker_init purges the broker, clears the lock, marks the interrupted video failed and starts the next queued one.";
  if (up.length) parts.push(`${up.length} upload${up.length > 1 ? "s are" : " is"} streaming through Caddy into tusd in 50 MiB chunks (${s.admission.length}/8 upload slots taken).`);
  if (retry.length) parts.push(`${retry.length} more ${retry.length > 1 ? "were" : "was"} refused with 503 and ${retry.length > 1 ? "are" : "is"} retrying.`);
  if (!s.cfg.lock) {
    const live = [...new Set(s.running.map((m) => m.vid))];
    if (s.broker.length || s.running.length) parts.push(`Pre-fix behaviour: ${s.videos.filter((v) => v.status !== "completed" && v.status !== "failed").length} videos' chains share one broker queue. A video's later stages wait behind other videos' transcodes, so nobody finishes early${live.length ? ` (worker busy with ${live.join(", ")})` : ""}.`);
  } else if (lockV) {
    const r = s.running.find((m) => m.vid === lockV.id && m.task === "transcode_quality");
    const doing = r ? `transcoding ${lockV.rungs[r.rung].q} (${lockV.rungs.filter((x) => x.state === "done" || x.state === "skipped").length}/7 rungs settled)` : lockV.status.replace(/_/g, " ");
    parts.push(`Video ${lockV.id} holds the processing lock and is ${doing}.`);
    if (q.length) parts.push(`${q.length} more wait their turn as 'queued' rows; each SET NX is refused until the lock is released.`);
  } else if (!up.length && !q.length && s.videos.length) {
    const done = s.videos.filter((v) => v.status === "completed" && !v.seed).length, failed = s.videos.filter((v) => v.status === "failed").length;
    const drafts = s.videos.filter((v) => v.status === "completed" && !v.public).length;
    parts.push(`Idle. ${done} video${done === 1 ? "" : "s"} processed${failed ? `, ${failed} failed` : ""}.${drafts ? ` ${drafts} ${drafts > 1 ? "are still drafts" : "is still a draft"} (is_public=false): the public feed can't serve ${drafts > 1 ? "them" : "it"} until an admin publishes.` : ""} The viewer plays the newest published title, switching renditions as its bandwidth moves.`);
  }
  return parts.join(" ") || "Pick a scenario. The plant is idle: no uploads, no lock, an empty broker.";
}

PLATES.plant = {
  mount(root) {
    const DATA = PLANT;
    const stage = root.querySelector(".stage");
    const R = plantRenderer(stage, DATA);
    const $ = (sel) => root.querySelector(sel);
    const cfg = { concurrency: 1, lock: true, speed: 1.5 };
    let s, seen = -1, scenario = null, touring = !stillQuery.matches, tourAt = 1.4, tourIdx = 0, idleFor = 0, storyAt = 0;

    const start = (id) => {
      s = createSim({ refs: REFS, concurrency: cfg.concurrency, lock: cfg.lock });
      seedCatalog(s);
      R.reset();
      seen = -1;
      scenario = id;
      $("[data-log]").replaceChildren();
      delete $("[data-log]").dataset.n;
      for (const [i, u] of (SCENARIOS[id]?.uploads || []).entries()) setTimeoutSim(() => addUpload(s, u), i * 0.25);
      $("[data-why]").textContent = SCENARIOS[id]?.why || "";
      $("[data-live]").textContent = SCENARIOS[id] ? `Scenario: ${SCENARIOS[id].label}` : "";
      for (const b of root.querySelectorAll("[data-run]")) b.setAttribute("aria-pressed", String(b.dataset.run === id));
    };
    const timers = [];
    const setTimeoutSim = (fn, at) => timers.push({ at, fn });
    const takeOver = () => { touring = false; };

    root.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => { takeOver(); timers.length = 0; start(b.dataset.run); }));
    root.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
      takeOver();
      const [key, val] = b.dataset.set.split(":");
      cfg[key] = key === "lock" ? val === "on" : Number(val);
      for (const o of root.querySelectorAll(`[data-set^="${key}:"]`)) o.setAttribute("aria-pressed", String(o === b));
      if (key !== "speed") { timers.length = 0; start(scenario || "burst"); }
    }));
    $("[data-kill]").addEventListener("click", () => { takeOver(); killWorker(s, 3); });
    const publishNewest = () => { const v = summary(s).drafts.sort((a, b) => b.done - a.done)[0]; if (v) publish(s, v.id); };
    $("[data-publish]").addEventListener("click", () => { takeOver(); publishNewest(); });
    focusing(root, DATA.stations, () => {});
    const zoom = zooming(root, DATA.stations);
    start(null);

    const stats = $("[data-stats]");
    const stop = frameLoop(stage, (dt, calm) => {
      if (window.__freeze) return;
      const sdt = dt * cfg.speed;
      s.t0 = (s.t0 || 0) + sdt;
      for (let i = timers.length - 1; i >= 0; i--) if (s.t0 >= timers[i].at) { const t = timers.splice(i, 1)[0]; t.fn(); }
      for (let i = 0; i < 4; i++) step(s, sdt / 4);
      for (const ev of s.traffic) if (ev.n > seen) { R.traffic(ev, calm); seen = ev.n; }
      R.render(s, dt, calm);
      renderLog($("[data-log]"), s.log);
      const sum = summary(s);
      const busy = !!(sum.uploading || sum.queued || sum.active.length || s.broker.length || s.running.length || timers.length || s.uploads.some((u) => u.state === "retrying" || u.state === "pre-create"));
      idleFor = busy ? 0 : idleFor + dt;
      if (touring && !busy && scenario && idleFor > 1.5 && summary(s).drafts.length) publishNewest();
      if (touring && !busy && idleFor > (scenario ? 7 : tourAt)) { start(TOUR[tourIdx++ % TOUR.length]); idleFor = 0; }
      storyAt -= dt;
      if (storyAt <= 0) {
        storyAt = 0.4;
        $("[data-story]").textContent = plantStory(s);
        const lockV = s.videos.find((v) => v.id === s.lock);
        root.querySelector("[data-readout]").textContent = `uploads ${s.admission.length}/8 · queued ${sum.queued} · ${lockV ? `${lockV.id} ${lockV.status.replace(/_/g, " ")} ${PROGRESS[lockV.status] ?? 0}%` : s.cfg.lock ? "lock free" : "no lock (pre-fix)"} · done ${sum.done}`;
        stats.innerHTML = [["uploading", sum.uploading], ["queued", sum.queued], ["done", sum.done], ["failed", sum.failed]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
      }
    });
    return { unmount: () => { stop(); zoom.stop(); } };
  },
};

// Plate 2 renderer: the loaf, the slices in flight, tusd's display, the parts in MinIO,
// the checkpoint lamps, the Redis keys and TTL dial, and the PostgreSQL rows.
function intakeRenderer(stage, D) {
  const P = D.P;
  const dyn = {};
  for (const el of stage.querySelectorAll("[data-dyn]")) dyn[el.dataset.dyn] = el;
  const lamps = {};
  for (const el of stage.querySelectorAll("[data-lamp]")) lamps[el.dataset.lamp] = el;
  const q = (sel) => stage.querySelector(sel);
  const show = (name, on) => dyn[name]?.toggleAttribute("data-hide", !on);
  const pulser = cablePulser(stage, { speed: 170 });
  const belt = q('[data-flight="belt"]'), chute = q('[data-flight="chute"]');
  const flashes = {};
  const flash = (name, warn = false, len = 0.4) => { flashes[name] = { left: len, warn }; };
  const t = {};
  for (const id of ["upbar", "uppct", "upphase", "offset", "ofsize", "buffer", "slots", "code", "ttl"]) t[id] = q(`[data-${id}]`);
  const rows = { tus: q('[data-row="tus"]'), video: q('[data-row="video"]') };
  let blade = 0, lastCode = "—";
  const pool = { belt: new Map(), chute: new Map() };

  function fly(layer, key, svg, x, z, alpha) {
    let g = pool[layer].get(key);
    if (!g) {
      g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.innerHTML = svg;
      (layer === "belt" ? belt : chute).append(g);
      pool[layer].set(key, g);
    }
    g.setAttribute("transform", translateAlong(P, [x, 0, z]));
    g.style.opacity = alpha;
    g.seen = true;
  }

  function traffic(ev, calm) {
    const w = ev.what;
    if (w === "blade") blade = 1;
    if (w === "files") flash("route-files");
    if (w === "status") { flash("route-status"); flash("hook-status"); }
    if (w === "tusd") flash("tusd");
    if (w === "minio") { flash("bucket"); flash("part"); }
    if (w === "reject") flash("reject", true, 1.6);
    if (w.startsWith("hook-")) { flash(w); if (!calm) pulser.send("hook", 1); }
    if (w === "redis" && !calm) pulser.send("redis", -1);
    if (w === "postgres" && !calm) pulser.send("postgres", 1);
  }

  function render(s, dt, calm) {
    const cut = Math.round(s.cut);
    for (let j = 0; j < D.chunks; j++) show(`slice-${j}`, j >= cut);
    const feed = translateAlong(P, [D.pitch * cut, 0, 0]);
    for (let j = 0; j < D.chunks; j++) dyn[`slice-${j}`]?.setAttribute("transform", feed);
    dyn.pusher?.setAttribute("transform", feed);
    blade = Math.max(0, blade - dt * 3.5);
    dyn.blade?.setAttribute("transform", translateAlong(P, [0, 0, -16 * Math.sin(Math.PI * blade)]));
    dyn.shutter?.setAttribute("transform", translateAlong(P, [0, 0, -22 * s.gate]));

    for (const m of Object.values(pool)) for (const g of m.values()) g.seen = false;
    for (const f of s.flying) {
      const age = s.t - f.born;
      if (f.where === "belt") {
        const w = D.widths[f.i];
        const run = D.belt.x1 - D.belt.x0 - w;
        const u = Math.min(1, age / 1.25);
        const x = f.lost ? D.belt.x0 + Math.min(u, 0.12) * run : D.belt.x0 + u * run;
        fly("belt", `b${f.i}${f.lost ? "x" : ""}`, D.sliceSvg[f.i], x, D.belt.z, f.lost ? Math.max(0, 1 - age / 0.6) : 1);
      } else if (f.where === "chute") {
        const u = Math.min(1, age / 0.55);
        fly("chute", `c${f.i}`, D.partSvg, D.chute.x0 + u * (D.partX[f.i] - D.chute.x0), D.chute.z, 1);
      }
    }
    for (const m of Object.values(pool)) for (const [key, g] of m) if (!g.seen) { g.remove(); m.delete(key); }

    for (let j = 0; j < D.parts; j++) show(`part-${j}`, !!s.parts[j]?.landed && !s.merged);
    show("object", s.merged);
    show("info", s.info);

    const pct = s.received / s.size;
    t.upbar?.setAttribute("width", (D.barW * pct).toFixed(2));
    if (t.uppct) t.uppct.textContent = `${Math.floor(pct * 100)}%`;
    if (t.upphase) t.upphase.textContent = phaseText(s);
    if (t.offset) t.offset.textContent = `${Math.round(s.received / 1048576)} MiB`;
    if (t.ofsize) t.ofsize.textContent = `of ${D.sizeMiB} MiB · ${s.parts.filter((p) => p.landed).length} parts written`;
    t.buffer?.setAttribute("width", ((76 * s.buffered) / 50e6).toFixed(2));

    const used = s.others + (s.ownKey ? 1 : 0);
    for (let i = 0; i < 8; i++) {
      show(`key-${i}`, i < used);
      dyn[`key-${i}`]?.classList.toggle("own", s.ownKey && i === s.others);
    }
    if (t.slots) t.slots.textContent = `${used} / 8`;
    const a = (2 * Math.PI * s.ttl) / 7200;
    t.ttl?.setAttribute("d", `M${D.dial.x} ${-D.dial.z}L${(D.dial.x + Math.sin(a) * (D.dial.r - 3)).toFixed(2)} ${(-D.dial.z - Math.cos(a) * (D.dial.r - 3)).toFixed(2)}`);

    s.checks.forEach((c, i) => {
      const el = lamps[`check-${D.checks[i]}`];
      el?.toggleAttribute("data-on", c === "pass");
      el?.toggleAttribute("data-warn", c === "fail");
    });
    lastCode = codeOf(s, lastCode);
    if (t.code) t.code.textContent = lastCode;
    rows.tus.textContent = s.rows.tus ? `${s.upload} · ${s.rows.tus}` : "—";
    rows.video.textContent = s.rows.video ? `${s.video} · queued · draft` : "—";
    const online = s.phase !== "offline" && s.phase !== "abandoned";
    lamps.link?.toggleAttribute("data-on", online);
    lamps.link?.toggleAttribute("data-warn", !online);

    for (const [name, f] of Object.entries(flashes)) {
      f.left -= dt;
      lamps[name]?.toggleAttribute(f.warn ? "data-warn" : "data-on", f.left > 0);
      if (f.left <= 0) delete flashes[name];
    }
    pulser.draw(calm ? 0 : dt);
  }

  return { render, traffic, reset() { pulser.clear(); lastCode = "—"; for (const m of Object.values(pool)) { for (const g of m.values()) g.remove(); m.clear(); } } };
}

function phaseText(s) {
  switch (s.phase) {
    case "post": case "checks": return "creating upload…";
    case "retry": return "503 · retrying";
    case "patching": return "uploading";
    case "offline": return "offline · will resume";
    case "bridge": return "finalizing";
    case "done": return `done · video ${s.video}`;
    case "rejected": return "failed · see error";
    case "abandoned": return "tab closed";
    default: return "";
  }
}

function codeOf(s, last) {
  const fail = s.checks.indexOf("fail");
  if (fail >= 0) return { admin: "403", mime: "400", slot: "503" }[["secret", "token", "admin", "meta", "size", "mime", "slot"][fail]] || last;
  if (s.phase === "checks" || s.phase === "post") return "…";
  if (s.phase === "patching" && s.received === 0) return "201";
  if (s.received > 0 && s.phase !== "done") return "204";
  if (s.phase === "done" || s.phase === "bridge") return "200";
  return last;
}

// Plate 2 controller: one focal upload per scenario, an idle tour, narration and stats.
const INTAKE_SCENARIOS = {
  happy: { label: "Upload a 420 MiB file", why: "The happy path. One POST creates the upload (after seven checks), nine PATCHes carry 50 MiB each, tusd turns them into nine 50 MB S3 parts, and post-finish turns the finished object into a queued Video row." },
  drop: { label: "Connection drops at 200 MiB", fault: "drop", why: "Why tus: the chunk in flight is lost, but every acknowledged byte is safe in tusd. When the browser is back, a HEAD asks for Upload-Offset and Uppy carries on from 200 MiB, not from zero." },
  capfrees: { label: "9th upload · a slot frees", fault: "cap-frees", others: 8, why: "Eight uploads already hold keys, so pre-create answers 503. 503 is a server error, so Uppy retries on its back-off (0.1, 1, 3, 5 s); another upload finishes in between, its key is deleted and the third attempt gets in." },
  cap: { label: "9th upload · cap holds", fault: "cap", others: 8, why: "Same 503, but no slot frees: after Uppy's four retries the admin sees 'Too many concurrent uploads'. The cap bounds tusd and S3 multipart churn; it is not what throttles transcoding (Plate 3 does that)." },
  notadmin: { label: "Not an admin", fault: "not-admin", why: "The hook re-reads the user from PostgreSQL instead of trusting the JWT's role claim, so a revoked admin is refused at once: 403, and Uppy does not retry a 4xx." },
  badtype: { label: "Wrong file type (.avi)", fault: "bad-type", why: "Only video/mp4, video/quicktime and video/webm get through: 400 before a single byte is stored." },
  abandon: { label: "Admin closes the tab", fault: "abandon", why: "No cancel button yet, and a closed tab sends no DELETE, so post-terminate never runs. The admission key just sits until its 2-hour TTL ends; that TTL was cut from 24 h for exactly this reason." },
};
const INTAKE_TOUR = ["happy", "drop", "capfrees", "notadmin", "abandon", "badtype", "cap"];

function intakeStory(s) {
  const mib = (b) => Math.round(b / 1048576);
  switch (s.phase) {
    case "post": return "Uppy announces the file with POST /files: its length and metadata (title, category, file type and the admin's access token). Caddy passes /files straight to tusd.";
    case "checks": return `tusd holds the request and asks FastAPI's pre-create hook first. Check ${s.check + 1} of 7: ${["the shared secret on the hook URL", "the JWT in the metadata", "is this user an admin (read from PostgreSQL)", "title and category", "the declared size", "the file type", "a free upload slot in Redis"][Math.max(0, s.check)]}.`;
    case "retry": return "Refused with 503: all eight upload slots are taken. Uppy waits and asks again.";
    case "patching": return `Uploading: ${mib(s.received)} of ${mib(s.size)} MiB acknowledged. Each slice is one PATCH; tusd ships every full 50 MB to MinIO as an S3 part.`;
    case "offline": return `Connection lost. ${mib(s.received)} MiB are already safe in tusd and MinIO; only the slice in flight is gone.`;
    case "bridge": return "Upload complete. MinIO has joined the parts, post-finish has created the Video row, and Uppy asks the status bridge which video it became.";
    case "done": return `Done: video ${s.video} is queued for processing as a draft. From here the Redis lock decides when it runs (Plate 3).`;
    case "rejected": return "Rejected before any data moved. Nothing was stored: no tus row, no key, no object.";
    case "abandoned": return s.ownKey ? "The tab is closed. Its admission key keeps one of the eight slots busy; watch the TTL dial run down (sped up)." : "The key expired, so the slot is free again. The partial parts stay in vod-videos as an unfinished multipart upload.";
    default: return "";
  }
}

PLATES.intake = {
  mount(root) {
    const D = INTAKE;
    const stage = root.querySelector(".stage");
    const R = intakeRenderer(stage, D);
    const $ = (sel) => root.querySelector(sel);
    let s, seen = -1, scenario = null, touring = !stillQuery.matches, tourIdx = 0, idle = 0, storyAt = 0, speed = 1;
    const start = (id) => {
      const sc = INTAKE_SCENARIOS[id];
      s = createIntake({ refs: REFS, fault: sc.fault ?? null, others: sc.others ?? 0 });
      R.reset();
      seen = -1;
      scenario = id;
      $("[data-log]").replaceChildren();
      delete $("[data-log]").dataset.n;
      $("[data-why]").textContent = sc.why;
      $("[data-live]").textContent = `Scenario: ${sc.label}`;
      for (const b of root.querySelectorAll("[data-run]")) b.setAttribute("aria-pressed", String(b.dataset.run === id));
    };
    root.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => { touring = false; start(b.dataset.run); }));
    root.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
      touring = false;
      speed = Number(b.dataset.set.split(":")[1]);
      for (const o of root.querySelectorAll('[data-set^="speed:"]')) o.setAttribute("aria-pressed", String(o === b));
    }));
    focusing(root, D.stations);
    const zoom = zooming(root, D.stations);
    start("happy");
    const stop = frameLoop(stage, (dt, calm) => {
      if (window.__freeze) return;
      const sdt = dt * speed;
      for (let i = 0; i < 4; i++) stepIntake(s, sdt / 4);
      for (const ev of s.traffic) if (ev.n > seen) { R.traffic(ev, calm); seen = ev.n; }
      R.render(s, dt, calm);
      renderLog($("[data-log]"), s.log);
      const settled = ["done", "rejected"].includes(s.phase) || (s.phase === "abandoned" && !s.ownKey);
      idle = settled ? idle + dt : 0;
      if (touring && idle > 4) start(INTAKE_TOUR[++tourIdx % INTAKE_TOUR.length]);
      storyAt -= dt;
      if (storyAt <= 0) {
        storyAt = 0.3;
        $("[data-story]").textContent = intakeStory(s);
        const parts = s.parts.filter((p) => p.landed).length;
        root.querySelector("[data-readout]").textContent = `offset ${Math.round(s.received / 1048576)}/${D.sizeMiB} MiB · ${parts}/${D.parts} parts · slots ${s.others + (s.ownKey ? 1 : 0)}/8 · ${s.phase}`;
        $("[data-stats]").innerHTML = [["MiB sent", Math.round(s.received / 1048576)], ["chunks", `${Math.min(s.cut, D.chunks)}/${D.chunks}`], ["parts", `${parts}/${D.parts}`], ["slots", `${s.others + (s.ownKey ? 1 : 0)}/8`]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
      }
    });
    return { unmount: () => { stop(); zoom.stop(); } };
  },
};

// Plate 3 renderer: maps the shared processing model onto the escapement, the broker chits,
// the presses, the outfeed and the back-row displays.
const TASK_SHORT = { prepare_video: "prep", generate_storyboard: "story", on_transcode_complete: "chord cb", segment_videos: "segment", create_manifest: "m3u8", upload_to_minio: "upload", finalize_processing: "final", on_pipeline_success: "success" };
const taskName = (s, m) => (m.task === "transcode_quality" ? LADDER[m.rung].q : TASK_SHORT[m.task] || m.task);

function queueRenderer(stage, D) {
  const P = D.P;
  const dyn = {};
  for (const el of stage.querySelectorAll("[data-dyn]")) dyn[el.dataset.dyn] = el;
  const lamps = {};
  for (const el of stage.querySelectorAll("[data-lamp]")) lamps[el.dataset.lamp] = el;
  const q = (sel) => stage.querySelector(sel);
  const show = (name, on) => dyn[name]?.toggleAttribute("data-hide", !on);
  const text = (el, v) => { if (el && el.textContent !== v) el.textContent = v; };
  const pulser = cablePulser(stage, { speed: 200 });
  const flight = q('[data-flight="gate"]');
  const t = {};
  for (const id of ["lockval", "setnx", "eval", "llen", "conc", "running", "tagid", "lockttl"]) t[id] = q(`[data-${id}]`);
  const rows = [...stage.querySelectorAll("[data-qrow]")];
  const flashes = {};
  const flash = (name, warn = false, len = 0.5) => { flashes[name] = { left: len, warn }; };
  let shift = 0, gateUp = 0, lastHead = null, lastLock = null, fly = null, seenLog = -1;
  const rams = [0, 0, 0];
  let setnx = "—", evalr = "—";

  function traffic(ev, calm) {
    if (ev.kind === "SET NX active_lock" && !calm) pulser.send("lock", -1);
    if (ev.kind === "EVAL release-if-owner" && !calm) pulser.send("lock", -1);
  }

  function readLog(s) {
    for (const e of s.log) {
      if (e.n <= seenLog) continue;
      seenLog = e.n;
      if (e.text.startsWith("SET video_processing")) { setnx = "OK"; flash("setnx"); }
      if (e.text.includes("SET NX refused")) { setnx = `refused · held by ${s.lock}`; flash("refused", true); }
      if (e.text.includes("release-if-owner")) { evalr = /deleted/.test(e.text) ? "1 · deleted" : "0 · not the owner"; if (!/deleted/.test(e.text)) flash("refused", true, 1.2); }
      if (e.text.includes("worker_init")) evalr = "lock cleared by worker_init";
    }
  }

  function render(s, dt, calm) {
    readLog(s);
    const queued = s.videos.filter((v) => v.status === "queued" && v.stage === "queued").sort((a, b) => a.created - b.created);
    const onStage = s.cfg.lock ? s.videos.filter((v) => v.id === s.lock) : s.videos.filter((v) => !v.seed && (IN_PROGRESS.includes(v.status) || v.stage === "dispatched"));
    if (lastHead && queued[0]?.id !== lastHead && !queued.some((v) => v.id === lastHead)) shift = 1;
    lastHead = queued[0]?.id ?? null;
    shift = calm ? 0 : Math.max(0, shift - dt * 2.5);
    const ease = translateAlong(P, [-D.magPitch * shift, 0, 0]);
    for (let i = 0; i < 11; i++) {
      show(`mag-${i}`, i < queued.length);
      dyn[`mag-${i}`]?.setAttribute("transform", ease);
    }
    if (s.lock && s.lock !== lastLock) { gateUp = 1; fly = { at: 0 }; }
    lastLock = s.lock;
    gateUp = Math.max(0, gateUp - dt * 0.9);
    dyn.gatebar?.setAttribute("transform", translateAlong(P, [0, 0, 24 * Math.min(1, gateUp * 2)]));
    if (fly) {
      fly.at += dt / 0.7;
      if (!fly.g) { fly.g = document.createElementNS("http://www.w3.org/2000/svg", "g"); fly.g.innerHTML = D.canSvg; flight.append(fly.g); }
      const x = D.magX0 + (D.stageX[0] - D.magX0) * Math.min(1, fly.at);
      fly.g.setAttribute("transform", translateAlong(P, [x, 0, 0]));
      if (fly.at >= 1 || calm) { fly.g.remove(); fly = null; }
    }
    for (let i = 0; i < 4; i++) show(`stage-${i}`, i < onStage.length && !(i === 0 && fly));
    const done = s.videos.filter((v) => v.status === "completed" && !v.seed).slice(-6);
    const failed = s.videos.filter((v) => v.status === "failed").slice(-6);
    for (let i = 0; i < 6; i++) { show(`done-${i}`, i < done.length); show(`failed-${i}`, i < failed.length); }
    lamps.failbin?.toggleAttribute("data-warn", failed.length > 0);

    for (let i = 0; i < 14; i++) {
      const m = s.broker[i];
      show(`chit-${i}`, !!m);
      if (m) { text(dyn[`chit-${i}`].querySelector("[data-chit-vid]"), m.vid); text(dyn[`chit-${i}`].querySelector("[data-chit-task]"), taskName(s, m)); }
    }
    for (const m of s.running) if (m.slot === undefined) { const used = s.running.map((x) => x.slot); m.slot = [0, 1, 2].find((i) => !used.includes(i)); }
    for (let i = 0; i < 3; i++) {
      const m = s.running.find((x) => x.slot === i);
      show(`run-${i}`, !!m);
      show(`lockout-${i}`, i >= s.cfg.concurrency);
      if (m) { text(dyn[`run-${i}`].querySelector("[data-chit-vid]"), m.vid); text(dyn[`run-${i}`].querySelector("[data-chit-task]"), taskName(s, m)); }
      rams[i] = calm ? (m ? 1 : 0) : rams[i] + ((m ? 1 : 0) - rams[i]) * (1 - Math.exp(-dt / 0.15));
      dyn[`ram-${i}`]?.setAttribute("transform", translateAlong(P, [0, 0, -22 * rams[i]]));
      lamps[`press-${i}`]?.toggleAttribute("data-on", !!m);
    }

    const active = s.videos.find((v) => v.id === s.lock) || s.videos.find((v) => v.id === s.running[0]?.vid);
    for (const st of STAGES.slice(1, 9)) lamps[`stage-${st}`]?.toggleAttribute("data-on", active?.status === st);
    lamps["worker-up"]?.toggleAttribute("data-on", s.worker === "up");
    lamps["worker-up"]?.toggleAttribute("data-warn", s.worker !== "up");
    show("locktag", !!s.lock);
    text(t.tagid, s.lock || "");
    text(t.lockval, s.cfg.lock ? s.lock || "nil" : "not used (pre-fix)");
    text(t.setnx, s.cfg.lock ? setnx : "not called");
    text(t.eval, evalr);
    text(t.llen, String(s.broker.length));
    text(t.conc, `--concurrency=${s.cfg.concurrency}`);
    text(t.running, s.worker !== "up" ? "restarting…" : s.running.map((m) => `${m.vid} ${taskName(s, m)}`).join(" · ") || "idle");
    t.lockttl?.setAttribute("visibility", s.lock ? "visible" : "hidden");
    const list = s.videos.filter((v) => !v.seed && v.status !== "completed" && v.status !== "failed").sort((a, b) => a.created - b.created);
    rows.forEach((el, i) => {
      const v = list[i];
      text(el, v ? `${v.id}  ${v.status.replace(/_/g, " ").padEnd(21)}${v.id === s.lock ? " ← holds the lock" : v.stage === "dispatched" ? " ← dispatched" : ""}` : "");
      el.classList.toggle("lit-row", !!v && v.id === s.lock);
    });

    for (const [name, f] of Object.entries(flashes)) {
      f.left -= dt;
      lamps[name]?.toggleAttribute(f.warn ? "data-warn" : "data-on", f.left > 0);
      if (f.left <= 0) delete flashes[name];
    }
    if (s.lock) lamps.setnx?.setAttribute("data-on", "");
    pulser.draw(calm ? 0 : dt);
  }

  return { render, traffic, reset() { pulser.clear(); setnx = "—"; evalr = "—"; lastHead = null; lastLock = null; seenLog = -1; fly?.g?.remove(); fly = null; } };
}

// Plate 3 controller: arrivals, the lock and broker switches, failure and restart events.
const QUEUE_SCENARIOS = {
  three: { label: "3 videos arrive", arrivals: [[0, {}], [0.5, { height: 720, duration: 240 }], [1, { height: 1440, duration: 420 }]], why: "The first post-finish wins SET NX and its chain goes to the broker; the next two calls find the key and return without doing anything. Each video waits as a 'queued' row until the one ahead hands the lock back." },
  wide: { label: "6 videos · 3 worker slots", conc: 3, arrivals: Array.from({ length: 6 }, (_, i) => [i * 0.3, { duration: 200 + i * 40 }]), why: "Local dev runs --concurrency=3. More slots only help inside one video: the seven transcodes of its chord run three at a time. The lock still lets just one video's chain into the broker." },
  prefix: { label: "Lock off · before the fix", lock: false, arrivals: Array.from({ length: 4 }, (_, i) => [i * 0.3, { duration: 240 + i * 60 }]), why: "History, not today: every post-finish dispatched its own chain into the same broker list. With one press, a video that finished transcoding still had its segment, manifest, upload and finalize steps queued behind everyone else's transcodes, so every video looked stuck until all of them were nearly done." },
  fail: { label: "A video fails", arrivals: [[0, { fault: "corrupt" }], [0.4, {}], [0.8, { duration: 200 }]], why: "ffprobe can't read the first file. prepare_video marks it failed and raises; the chain's link_error, on_pipeline_failed, runs inside the failing worker with the real exception, releases the lock (owner check first) and starts the next queued video." },
  restart: { label: "Worker restarts mid-video", arrivals: [[0, { duration: 600 }], [0.4, {}], [0.8, {}]], kill: 6, why: "A redeploy or an OOM kill. On boot, worker_init purges the broker (stray transcodes can't finish a chord on their own), deletes the lock, marks the interrupted video failed with a clear message and starts the oldest queued video." },
  stale: { label: "Late duplicate callback", arrivals: [[0, { duration: 160 }], [0.4, { duration: 420 }]], stale: true, why: "Why release is a Lua script: a late or duplicate callback from a finished video runs release-if-owner. GET returns the new holder's id, which isn't its own, so DEL never runs and the running video keeps its slot." },
};
const QUEUE_TOUR = ["three", "fail", "prefix", "wide", "restart", "stale"];

function queueStory(s) {
  const q = s.videos.filter((v) => v.status === "queued" && v.stage === "queued").length;
  const lockV = s.videos.find((v) => v.id === s.lock);
  if (s.worker !== "up") return "The worker is restarting. Until it's back, nothing consumes the broker; when it boots, worker_init cleans up before taking a single message.";
  if (!s.cfg.lock) return `No lock: ${s.videos.filter((v) => !v.seed && v.status !== "completed" && v.status !== "failed").length} videos in flight share one broker list of ${s.broker.length} chits. Look at the chit labels: steps of different videos are interleaved.`;
  if (lockV) return `${lockV.id} holds the lock and is ${lockV.status.replace(/_/g, " ")}. ${q ? `${q} waiting in created_at order; nothing else can start until the tag comes off the hook.` : "Nothing else is waiting."} The broker holds ${s.broker.length} of its chits.`;
  const done = s.videos.filter((v) => v.status === "completed" && !v.seed).length, failed = s.videos.filter((v) => v.status === "failed").length;
  return s.videos.length ? `The queue is empty and the lock is free. ${done} done${failed ? `, ${failed} failed` : ""}.` : "Waiting for uploads.";
}

PLATES.queue = {
  mount(root) {
    const D = QUEUE;
    const stage = root.querySelector(".stage");
    const R = queueRenderer(stage, D);
    const $ = (sel) => root.querySelector(sel);
    let s, seen = -1, scenario, touring = !stillQuery.matches, tourIdx = 0, idle = 0, storyAt = 0, speed = 1.5, timers = [], clock = 0, staleDone = false;
    const start = (id) => {
      const sc = QUEUE_SCENARIOS[id];
      s = createSim({ refs: REFS, concurrency: sc.conc ?? 1, lock: sc.lock ?? true });
      clock = 0;
      staleDone = false;
      timers = sc.arrivals.map(([at, o]) => ({ at, fn: () => arrive(s, o) }));
      if (sc.kill) timers.push({ at: sc.kill, fn: () => killWorker(s, 2.5) });
      R.reset();
      seen = -1;
      scenario = id;
      $("[data-log]").replaceChildren();
      delete $("[data-log]").dataset.n;
      $("[data-why]").textContent = sc.why;
      $("[data-live]").textContent = `Scenario: ${sc.label}`;
      for (const b of root.querySelectorAll("[data-run]")) b.setAttribute("aria-pressed", String(b.dataset.run === id));
    };
    root.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => { touring = false; start(b.dataset.run); }));
    root.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
      touring = false;
      speed = Number(b.dataset.set.split(":")[1]);
      for (const o of root.querySelectorAll('[data-set^="speed:"]')) o.setAttribute("aria-pressed", String(o === b));
    }));
    $("[data-kill]")?.addEventListener("click", () => { touring = false; killWorker(s, 2.5); });
    $("[data-arrive]")?.addEventListener("click", () => { touring = false; arrive(s, { duration: 240 }); });
    focusing(root, D.stations);
    const zoom = zooming(root, D.stations);
    start("three");
    const stop = frameLoop(stage, (dt, calm) => {
      if (window.__freeze) return;
      const sdt = dt * speed;
      clock += sdt;
      for (let i = timers.length - 1; i >= 0; i--) if (clock >= timers[i].at) timers.splice(i, 1)[0].fn();
      if (QUEUE_SCENARIOS[scenario].stale && !staleDone && s.lock && s.videos.some((v) => v.status === "completed" && !v.seed && v.id !== s.lock)) staleDone = staleRelease(s);
      for (let i = 0; i < 4; i++) step(s, sdt / 4);
      for (const ev of s.traffic) if (ev.n > seen) { R.traffic(ev, calm); seen = ev.n; }
      R.render(s, dt, calm);
      renderLog($("[data-log]"), s.log);
      const busy = timers.length || s.broker.length || s.running.length || s.lock || s.worker !== "up" || s.videos.some((v) => v.status === "queued");
      idle = busy ? 0 : idle + dt;
      if (touring && idle > 4) start(QUEUE_TOUR[++tourIdx % QUEUE_TOUR.length]);
      storyAt -= dt;
      if (storyAt <= 0) {
        storyAt = 0.3;
        $("[data-story]").textContent = queueStory(s);
        const sum = summary(s);
        root.querySelector("[data-readout]").textContent = `lock ${s.cfg.lock ? s.lock || "free" : "off"} · queued ${sum.queued} · broker ${s.broker.length} · slots ${s.running.length}/${s.cfg.concurrency} · done ${sum.done}`;
        $("[data-stats]").innerHTML = [["queued", sum.queued], ["broker", s.broker.length], ["done", sum.done], ["failed", sum.failed]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
      }
    });
    return { unmount: () => { stop(); zoom.stop(); } };
  },
};

// Plate 4 renderer: download and probe, storyboard tiles and cues, the seven presses, their
// ffmpeg commands, the rendition blocks (with letterbox or pillarbox bars) and the chord count.
function transcodeRenderer(stage, D) {
  const P = D.P;
  const dyn = {};
  for (const el of stage.querySelectorAll("[data-dyn]")) dyn[el.dataset.dyn] = el;
  const lamps = {};
  for (const el of stage.querySelectorAll("[data-lamp]")) lamps[el.dataset.lamp] = el;
  const q = (sel) => stage.querySelector(sel);
  const show = (name, on) => dyn[name]?.toggleAttribute("data-hide", !on);
  const text = (el, v) => { if (el && el.textContent !== v) el.textContent = v; };
  const pulser = cablePulser(stage, { speed: 190 });
  const tiles = [...stage.querySelectorAll("[data-tile]")];
  const cmds = [...stage.querySelectorAll("[data-cmd]")];
  const t = {};
  for (const id of ["probe", "cue", "sheets", "left"]) t[id] = q(`[data-${id}]`);
  const flashes = {};
  const flash = (name, warn = false, len = 0.35) => { flashes[name] = { left: len, warn }; };
  const heads = new Array(7).fill(0);
  let probeHead = 0;
  const ts = (sec) => `${String(Math.floor(sec / 3600)).padStart(2, "0")}:${String(Math.floor((sec % 3600) / 60)).padStart(2, "0")}:${(sec % 60).toFixed(3).padStart(6, "0")}`;
  const poly = (pts) => "M" + pts.map((p) => iso(p, P).map((v) => v.toFixed(2)).join(" ")).join("L") + "Z";

  function padBars(i, r) {
    const d = D.die[i], x0 = D.stationX[i] - d.w / 2, x1 = x0 + d.w, y0 = D.outY - d.d / 2, y1 = y0 + d.d, z = D.bedH + 1 + D.blockH[i];
    const fx = r.fit.padX / r.w, fy = r.fit.padY / r.h;
    if (fx > 0.01) return poly([[x0, y0, z], [x0 + d.w * fx, y0, z], [x0 + d.w * fx, y1, z], [x0, y1, z]]) + poly([[x1 - d.w * fx, y0, z], [x1, y0, z], [x1, y1, z], [x1 - d.w * fx, y1, z]]);
    if (fy > 0.01) return poly([[x0, y0, z], [x1, y0, z], [x1, y0 + d.d * fy, z], [x0, y0 + d.d * fy, z]]) + poly([[x0, y1 - d.d * fy, z], [x1, y1 - d.d * fy, z], [x1, y1, z], [x0, y1, z]]);
    return "";
  }

  function traffic(ev, calm) {
    const w = ev.what;
    if (w === "download") { flash("download"); flash("videos"); if (!calm) pulser.send("download", 1); }
    if (w === "thumbs") { flash("thumbs"); flash("thumbs-in"); if (!calm) pulser.send("thumbs", 1); }
    if (w === "callback") flash("callback", false, 3);
  }

  function render(s, dt, calm) {
    const downloaded = s.got >= s.src.mb;
    show("srccan", downloaded);
    probeHead = calm ? +(s.phase === "probe") : probeHead + (+(s.phase === "probe") - probeHead) * (1 - Math.exp(-dt / 0.15));
    dyn.probehead?.setAttribute("transform", translateAlong(P, [0, 0, -14 * probeHead]));
    text(t.probe, !downloaded ? `downloading ${Math.round(s.got)} / ${s.src.mb} MB` : s.phase === "probe" ? "probing…" : `${s.src.w}×${s.src.h} · ${s.src.duration} s`);

    const n = Math.floor(s.tiles);
    const sheet = Math.min(Math.floor(Math.max(0, n - 1) / 100), s.sheets - 1);
    tiles.forEach((el, i) => el.toggleAttribute("data-on", sheet * 100 + i < n));
    text(t.sheets, String(n ? Math.ceil(n / 100) : 0));
    if (n) {
      const c = n - 1, pos = c % 100;
      text(t.cue, `${ts(c * 5)} --> ${ts(Math.min((c + 1) * 5, s.src.duration))}  sprite_${String(Math.floor(c / 100)).padStart(3, "0")}.jpg#xywh=${(pos % 10) * s.tile.w},${Math.floor(pos / 10) * s.tile.h},${s.tile.w},${s.tile.h}`);
    } else text(t.cue, s.sbFailed ? "failed · skipped, chain continues" : "—");
    lamps.fuse?.toggleAttribute("data-on", !s.sbFailed && s.phase !== "download");
    lamps.fuse?.toggleAttribute("data-warn", !!s.sbFailed);

    s.rungs.forEach((r, i) => {
      const run = s.running.find((j) => j.i === i);
      show(`skip-${i}`, r.state === "skipped" || r.state === "skipping");
      show(`out-${i}`, r.state === "done");
      const pad = stage.querySelector(`[data-padbar="${i}"]`);
      if (r.state === "done" && pad && !pad.dataset.set) { pad.setAttribute("d", padBars(i, r)); pad.dataset.set = "1"; }
      heads[i] = calm ? (run ? 1 : 0) : heads[i] + ((run ? 1 : 0) - heads[i]) * (1 - Math.exp(-dt / 0.15));
      dyn[`head-${i}`]?.setAttribute("transform", translateAlong(P, [0, 0, -24 * heads[i] * (run?.skip ? 0.3 : 1)]));
      lamps[`press-${i}`]?.toggleAttribute("data-on", !!run);
      q(`[data-rp="${i}"]`)?.setAttribute("width", (44 * (r.state === "done" || r.state === "skipped" ? 1 : r.p)).toFixed(2));
      lamps[`chord-${i}`]?.toggleAttribute("data-on", r.state === "done" || r.state === "skipped");
    });
    cmds.forEach((el, k) => {
      const job = s.running[k];
      if (!job) return text(el, "");
      const r = s.rungs[job.i];
      text(el, job.skip ? `${r.q}: target ${r.h}p > source ${s.src.h}p → return { skipped: True }` : `ffmpeg -i raw.mp4 -c:v libx264 -threads 2 -preset medium -crf 23 -vf scale=w=${r.w}:h=${r.h}:force_original_aspect_ratio=decrease,pad=w=${r.w}:h=${r.h}:x=(ow-iw)/2:y=(oh-ih)/2 -b:v ${r.kbps}k -c:a aac -b:a 128k ${r.q}.mp4`);
    });
    text(t.left, String(s.left));
    lamps.callback?.toggleAttribute("data-on", s.phase === "done");

    for (const [name, f] of Object.entries(flashes)) {
      f.left -= dt;
      lamps[name]?.toggleAttribute(f.warn ? "data-warn" : "data-on", f.left > 0);
      if (f.left <= 0) delete flashes[name];
    }
    pulser.draw(calm ? 0 : dt);
  }

  return { render, traffic, reset() { pulser.clear(); for (const el of stage.querySelectorAll("[data-padbar]")) { el.setAttribute("d", ""); delete el.dataset.set; } } };
}

// Plate 4 controller: one video's prepare → storyboard → chord, per source and slot count.
const TRANSCODE_SCENARIOS = {
  hd: { label: "1080p source", source: "hd", why: "The common case. The chord queues all seven transcodes; 1440p returns 'skipped' at once (no upscaling), the other six are encoded one after another on prod's single worker slot." },
  qhd: { label: "1440p source", source: "qhd", why: "A source as tall as the top rung: nothing is skipped, all seven renditions are encoded, and the 1440p press runs longest (four times the pixels of 720p)." },
  sd: { label: "480p source", source: "sd", why: "Small source: 1440p, 1080p and 720p are skipped, so master.m3u8 will list only four variants. Skipping costs a message round trip, not an encode." },
  phone: { label: "Phone video 9:16", source: "phone", why: "A 1080×1920 portrait clip. It is taller than every rung, so nothing is skipped; each rung scales it to fit the 16:9 box and pads the sides: the dark bars on every block are the pillarbox, not a stretch." },
  wide: { label: "3 worker slots (local)", source: "hd", concurrency: 3, why: "Local dev runs --concurrency=3, so three presses run at once and the chord finishes sooner. The storyboard still runs first and alone: it's a plain chain step." },
  sbfail: { label: "Storyboard fails", source: "hd", storyboardFails: true, why: "The scrubbing preview is cosmetic, so generate_storyboard catches its own errors, logs a warning and returns the data unchanged. Transcoding goes ahead; the video just has no storyboard_url." },
};
const TRANSCODE_TOUR = ["hd", "phone", "sd", "wide", "qhd", "sbfail"];

function transcodeStory(s) {
  switch (s.phase) {
    case "download": return `prepare_video is streaming the raw upload from MinIO to the worker's disk: ${Math.round(s.got)} of ${s.src.mb} MB.`;
    case "probe": return "ffprobe reads the container and streams: width, height, duration and codecs. Everything after this is planned from those numbers.";
    case "storyboard": return `One ffmpeg pass grabs a frame every 5 s and tiles them 10×10: ${Math.floor(s.tiles)} of ${s.cues} tiles, one WebVTT cue per tile.`;
    case "chord": {
      const run = s.running.map((j) => s.rungs[j.i].q).join(", ");
      return `The chord: ${7 - s.left} of 7 transcodes reported. ${run ? `Encoding ${run} now` : "Waiting for the next message"}; ${s.queue.length} still queued in the broker.`;
    }
    case "done": return `All seven reported, so Celery runs on_transcode_complete: ${s.rungs.filter((r) => r.state === "done").length} usable renditions go on to segmenting (Plate 5).`;
    default: return "";
  }
}

PLATES.transcode = {
  mount(root) {
    const D = TRANSCODE;
    const stage = root.querySelector(".stage");
    const R = transcodeRenderer(stage, D);

    const start = (id) => {
      const sc = TRANSCODE_SCENARIOS[id];
      s = createTranscode({ refs: REFS, source: sc.source, concurrency: sc.concurrency ?? 1, storyboardFails: !!sc.storyboardFails });
      R.reset();
      seen = -1;
      $("[data-log]").replaceChildren();
      delete $("[data-log]").dataset.n;
      $("[data-why]").textContent = sc.why;
      $("[data-live]").textContent = `Scenario: ${sc.label}`;
      for (const b of root.querySelectorAll("[data-run]")) b.setAttribute("aria-pressed", String(b.dataset.run === id));
    };
    root.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => { touring = false; start(b.dataset.run); }));
    root.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
      touring = false;
      speed = Number(b.dataset.set.split(":")[1]);
      for (const o of root.querySelectorAll('[data-set^="speed:"]')) o.setAttribute("aria-pressed", String(o === b));
    }));
    focusing(root, D.stations);
    const zoom = zooming(root, D.stations);
    start("hd");
    const stop = frameLoop(stage, (dt, calm) => {
      if (window.__freeze) return;
      for (let i = 0; i < 4; i++) stepTranscode(s, (dt * speed) / 4);
      for (const ev of s.traffic) if (ev.n > seen) { R.traffic(ev, calm); seen = ev.n; }
      R.render(s, dt, calm);
      renderLog($("[data-log]"), s.log);
      idle = s.phase === "done" ? idle + dt : 0;
      if (touring && idle > 4.5) start(TRANSCODE_TOUR[++tourIdx % TRANSCODE_TOUR.length]);
      storyAt -= dt;
      if (storyAt <= 0) {
        storyAt = 0.3;
        $("[data-story]").textContent = transcodeStory(s);
        const done = s.rungs.filter((r) => r.state === "done").length, skipped = s.rungs.filter((r) => r.state === "skipped").length;
        root.querySelector("[data-readout]").textContent = `${s.src.w}×${s.src.h} · ${s.phase} · ${done} encoded · ${skipped} skipped · chord ${s.left} left`;
        $("[data-stats]").innerHTML = [["tiles", `${Math.floor(s.tiles)}/${s.cues}`], ["encoded", done], ["skipped", skipped], ["chord left", s.left]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
      }
    });
    return { unmount: () => { stop(); zoom.stop(); } };
  },
};

// Plate 5 renderer: segments in the rack, the master playlist printing, MinIO's folders,
// the finalize row, and the player (picture sharpness, timeline, ABR knob, buffer plates).
function packageRenderer(stage, D) {
  const P = D.P;
  const dyn = {};
  for (const el of stage.querySelectorAll("[data-dyn]")) dyn[el.dataset.dyn] = el;
  const lamps = {};
  for (const el of stage.querySelectorAll("[data-lamp]")) lamps[el.dataset.lamp] = el;
  const q = (sel) => stage.querySelector(sel);
  const show = (name, on) => dyn[name]?.toggleAttribute("data-hide", !on);
  const text = (el, v) => { if (el && el.textContent !== v) el.textContent = v; };
  const pulser = cablePulser(stage, { speed: 260 });
  const mlines = [...stage.querySelectorAll("[data-mline]")];
  const t = {};
  for (const id of ["masterfile", "level", "est", "played", "buffered", "pixels", "preview", "pvbox", "pvtile", "pvtext", "abr", "bw"]) t[id] = q(`[data-${id}]`);
  const final = Object.fromEntries([...stage.querySelectorAll("[data-final]")].map((el) => [el.dataset.final, el]));
  const cubbies = [...stage.querySelectorAll("[data-cubby]")];
  const flashes = {};
  const flash = (name, len = 0.3) => { flashes[name] = { left: len }; };
  let sawY = 0, putClock = 0, pixLevel = null, scrubT = 0;
  const S = D.screen, W = S.x1 - S.x0 - 12;

  function traffic(ev, calm) {
    const w = ev.what;
    if (w === "print") flash("print");
    if (w === "master") { flash("master", 0.6); if (!calm) pulser.send("storage", 1); }
    if (w === "put" && !calm && (putClock -= 1) <= 0) { putClock = 6; pulser.send("upload", 1); }
    if (w === "fetch") { flash("storage"); if (!calm) { pulser.send("storage", 1); setTimeout(() => pulser.send("viewer", 1), 300); } }
    if (w === "abort") flash("storage", 0.8);
  }

  function pixels(level) {
    if (pixLevel === level?.i) return;
    pixLevel = level?.i;
    if (!level || level.h >= 1080) return t.pixels.replaceChildren();
    const step = Math.max(2.4, (2560 / level.w) * 2.4);
    let d = "";
    for (let x = S.x0 + step; x < S.x1; x += step) d += `M${x.toFixed(1)} ${-S.z1}V${-S.z0}`;
    for (let z = S.z0 + step; z < S.z1; z += step) d += `M${S.x0} ${-z.toFixed(1)}H${S.x1}`;
    t.pixels.innerHTML = `<path class="pixgrid" d="${d}"/>`;
  }

  function render(s, dt, calm) {
    const done = ["finalize", "play", "ended"].includes(s.phase);
    s.rungs.forEach((r, i) => {
      show(`src-${i}`, r.ok);
      show(`cap-${i}`, !r.ok);
      for (let j = 0; j < D.segs; j++) {
        show(`seg-${i}-${j}`, r.ok && j < Math.floor(r.segs) && !(done && s.phase !== "finalize"));
        dyn[`seg-${i}-${j}`]?.classList.toggle("sent", r.uploaded > j + 1);
      }
    });
    const lane = s.phase === "segment" ? D.laneY[s.cur] - D.laneY[0] : 0;
    sawY = calm ? lane : sawY + (lane - sawY) * (1 - Math.exp(-dt / 0.18));
    dyn.saw?.setAttribute("transform", translateAlong(P, [0, sawY, 0]));
    lamps.saw?.toggleAttribute("data-on", s.phase === "segment");
    const lines = masterLines(s.avail);
    mlines.forEach((el, i) => text(el, i < s.lines ? lines[i] : ""));
    text(t.masterfile, ["upload", "finalize", "play", "ended"].includes(s.phase) ? `master.m3u8 · ${s.avail.length} variants` : "master.m3u8 —");
    cubbies.forEach((el, i) => el.setAttribute("width", ((38 * s.rungs[i].uploaded) / (D.segs + 1)).toFixed(2)));
    text(final.status, done ? "processing_status: completed" : `processing_status: ${s.phase === "segment" ? "segmenting" : s.phase === "manifest" ? "creating_manifest" : "uploading_to_storage"}`);
    text(final.manifest, done ? "manifest_url: …/master.m3u8" : "manifest_url: null");
    text(final.qualities, done ? `qualities: ${s.avail.map((r) => r.q.replace("p", "")).join(",")}` : "qualities: []");
    text(final.workdir, done ? "work dir: deleted" : "work dir: /tmp/video_processing/3c6e");

    const p = s.play;
    const playing = s.phase === "play" || s.phase === "ended";
    pixels(playing ? p.level : null);
    text(t.level, playing && p.level ? `${p.level.q} · ${p.level.w}×${p.level.h} · ${(p.level.kbps / 1000).toFixed(1)} Mbps` : s.phase === "ended" ? "ended" : "waiting for manifest_url");
    const now = playing ? PROFILES[s.profile](s.t - s.at) : 0;
    text(t.est, playing ? `estimate ${p.est.toFixed(1)} Mbps · buffer ${Math.round(p.buffered)} s` : "");
    t.played.setAttribute("width", ((W * p.head) / 120).toFixed(2));
    t.buffered.setAttribute("width", ((W * Math.min(120, p.head + p.buffered)) / 120).toFixed(2));
    for (let b = 0; b < 10; b++) for (let i = 0; i < 7; i++) show(`buf-${b}-${i}`, playing && p.queue[b] === i);
    const pos = playing && p.level ? 6 - p.level.i : 0;
    const a = -2.2 + pos * (4.4 / 6);
    t.abr?.setAttribute("d", lineOnTop([D.abr.x, D.abr.y], [D.abr.x + Math.sin(a) * 7, D.abr.y - Math.cos(a) * 7], D.abr.z, P));
    const b = -2.2 + 4.4 * Math.min(1, now / 16);
    t.bw?.setAttribute("d", lineOnTop([D.bw.x, D.bw.y], [D.bw.x + Math.sin(b) * 11, D.bw.y - Math.cos(b) * 11], D.bw.z, P));

    const scrubbing = s.scrub && playing;
    t.preview.style.display = scrubbing ? "" : "none";
    if (scrubbing) {
      scrubT += dt;
      const sec = 60 + 55 * Math.sin(scrubT * 0.5);
      const c = cueAt(sec);
      const x = S.x0 + 6 + (W * sec) / 120;
      t.pvbox.setAttribute("x", (x - 26).toFixed(1));
      t.pvtile.setAttribute("x", (x - 23).toFixed(1));
      text(t.pvtext, `sprite_00${c.sheet}.jpg#xywh=${c.x},${c.y},160,90`);
      t.pvtext.setAttribute("x", (x - 24).toFixed(1));
      if (Math.floor(scrubT * 2) !== Math.floor((scrubT - dt) * 2)) flash("thumbs", 0.4);
    }

    for (const [name, f] of Object.entries(flashes)) {
      f.left -= dt;
      lamps[name]?.toggleAttribute("data-on", f.left > 0);
      if (f.left <= 0) delete flashes[name];
    }
    pulser.draw(calm ? 0 : dt);
  }

  return { render, traffic, reset() { pulser.clear(); pixLevel = -1; scrubT = 0; } };
}

// Plate 5 controller: packaging, then playback under different networks and players.
const PACKAGE_SCENARIOS = {
  good: { label: "1080p source · good connection", sourceH: 1080, profile: "steady", why: "Six renditions (1440p was never encoded) are cut into segments and listed in master.m3u8. The player starts from a cautious 1 Mbps guess, so the first segment is 360p; once it has measured the link, it climbs to 1080p." },
  drop: { label: "Bandwidth drops mid-play", sourceH: 1080, profile: "drop", why: "The link falls to about 1 Mbps. The 60-second buffer rides out the first part of the dip; when new fetches come in slow, hls.js steps down to a rendition the link can carry, then climbs back as the link recovers. No stall." },
  sd: { label: "480p source · slow link", sourceH: 480, profile: "slow", why: "Only four variants exist, and the link is about 2.4 Mbps: hls.js settles on 480p, the best this source has. A smaller ladder means fewer, cheaper segments to store." },
  small: { label: "Small player (640 px wide)", sourceH: 1080, profile: "steady", playerWidth: 640, why: "capLevelToPlayerSize: true. Even on a fast link, hls.js won't fetch more pixels than the player can show: it stops at the first rendition at least as wide as the player, here 360p." },
  scrub: { label: "Scrub the timeline", sourceH: 1080, profile: "steady", scrub: true, why: "Scrubbing previews don't touch the video: the player reads storyboard.vtt from vod-thumbnails and, for the time under the cursor, shows the cue's tile of the sprite sheet (#xywh=x,y,w,h)." },
};
const PACKAGE_TOUR = ["good", "drop", "small", "scrub", "sd"];

function packageStory(s) {
  switch (s.phase) {
    case "segment": return `segment_videos copies ${s.rungs[s.cur].q} into ~6-second .ts segments (no re-encode): ${Math.floor(s.rungs[s.cur].segs)} of ${SEGS}. Renditions go one after another in a single task.`;
    case "manifest": return "create_manifest writes master.m3u8: one #EXT-X-STREAM-INF line per rendition, with its bandwidth and resolution, pointing at that rendition's own playlist.";
    case "upload": return `upload_to_minio: master.m3u8 first, then each folder of playlist + segments into vod-processed (${s.avail[Math.min(s.cur, s.avail.length - 1)]?.q}).`;
    case "finalize": return "finalize_processing marks the video completed, saves manifest_url and available_qualities, and deletes the work dir.";
    case "play": {
      const p = s.play;
      return p.level ? `Playing ${p.level.q}. hls.js estimates ${p.est.toFixed(1)} Mbps and has ${Math.round(p.buffered)} s buffered; each fetch is one ${p.level.q}/segment_NNNN.ts through /storage.` : "The player loads master.m3u8 through Caddy's /storage route.";
    }
    case "ended": return `Played to the end with ${s.play.switches} rendition switch(es) and ${s.play.stalls} stall(s).`;
    default: return "";
  }
}

PLATES.package = {
  mount(root) {
    const D = PACKAGE;
    const stage = root.querySelector(".stage");
    const R = packageRenderer(stage, D);
    const $ = (sel) => root.querySelector(sel);
    let s, seen = -1, touring = !stillQuery.matches, tourIdx = 0, idle = 0, storyAt = 0, speed = 1.5;
    const start = (id) => {
      const sc = PACKAGE_SCENARIOS[id];
      s = createPackage({ refs: REFS, sourceH: sc.sourceH, profile: sc.profile, playerWidth: sc.playerWidth ?? 1920, scrub: !!sc.scrub });
      R.reset();
      seen = -1;
      $("[data-log]").replaceChildren();
      delete $("[data-log]").dataset.n;
      $("[data-why]").textContent = sc.why;
      $("[data-live]").textContent = `Scenario: ${sc.label}`;
      for (const b of root.querySelectorAll("[data-run]")) b.setAttribute("aria-pressed", String(b.dataset.run === id));
    };
    root.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => { touring = false; start(b.dataset.run); }));
    root.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
      touring = false;
      speed = Number(b.dataset.set.split(":")[1]);
      for (const o of root.querySelectorAll('[data-set^="speed:"]')) o.setAttribute("aria-pressed", String(o === b));
    }));
    focusing(root, D.stations);
    const zoom = zooming(root, D.stations);
    start("good");
    const stop = frameLoop(stage, (dt, calm) => {
      if (window.__freeze) return;
      const k = s.phase === "play" ? 4 : 1;
      for (let i = 0; i < 4; i++) stepPackage(s, (dt * speed * k) / 4);
      for (const ev of s.traffic) if (ev.n > seen) { R.traffic(ev, calm); seen = ev.n; }
      R.render(s, dt, calm);
      renderLog($("[data-log]"), s.log);
      idle = s.phase === "ended" ? idle + dt : 0;
      if (touring && idle > 4) start(PACKAGE_TOUR[++tourIdx % PACKAGE_TOUR.length]);
      storyAt -= dt;
      if (storyAt <= 0) {
        storyAt = 0.3;
        $("[data-story]").textContent = packageStory(s);
        const p = s.play;
        root.querySelector("[data-readout]").textContent = `${s.phase} · ${s.avail.length} variants · ${p.level ? `${p.level.q} · est ${p.est.toFixed(1)} Mbps · buffer ${Math.round(p.buffered)} s` : "not playing"}`;
        $("[data-stats]").innerHTML = [["variants", s.avail.length], ["segments", s.avail.length * SEGS], ["switches", p.switches], ["stalls", p.stalls]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
      }
    });
    return { unmount: () => { stop(); zoom.stop(); } };
  },
};

window.__vod = { PLANT, INTAKE, QUEUE, TRANSCODE, PACKAGE, translateAlong, iso }; initTheme(); initTabs();</script>
